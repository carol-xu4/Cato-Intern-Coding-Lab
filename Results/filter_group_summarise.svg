<text x="779" y="116" style="font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:26px;fill:#fff" text-anchor="middle">4</text>
<rect x="854" y="72" width="70" height="70" rx="10" fill="#3043B4" opacity="0.45"></rect>
<rect x="850" y="68" width="70" height="70" rx="10" fill="#3043B4" opacity="0.7"></rect>
<rect x="846" y="64" width="70" height="70" rx="10" fill="#3043B4"></rect>
<text x="881" y="86" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;fill:#fff" text-anchor="middle">2022</text>
<text x="881" y="116" style="font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:26px;fill:#fff" text-anchor="middle">3</text>
<rect x="948" y="68" width="70" height="70" rx="10" fill="#6D3FA3" opacity="0.6"></rect>
<rect x="944" y="64" width="70" height="70" rx="10" fill="#6D3FA3"></rect>
<text x="979" y="86" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;fill:#fff" text-anchor="middle">2023</text>
<text x="979" y="116" style="font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:26px;fill:#fff" text-anchor="middle">2</text>
<rect x="1038" y="64" width="70" height="70" rx="10" fill="#C97703"></rect>
<text x="1073" y="86" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;fill:#fff" text-anchor="middle">2024</text>
<text x="1073" y="116" style="font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:26px;fill:#fff" text-anchor="middle">1</text>
<text x="926" y="160" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;fill:#5B6070" text-anchor="middle">count the number in each group</text>
</svg>
