<rect x="569" y="64" width="20" height="30" rx="5" fill="#3043B4"></rect>
<rect x="592" y="64" width="20" height="30" rx="5" fill="#3043B4"></rect>
<rect x="569" y="100" width="20" height="30" rx="5" fill="#3043B4"></rect>
<text x="642" y="54" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;fill:#5B6070" text-anchor="middle">2023</text>
<rect x="632" y="64" width="20" height="30" rx="5" fill="#6D3FA3"></rect>
<rect x="632" y="100" width="20" height="30" rx="5" fill="#6D3FA3"></rect>
<text x="682" y="54" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;fill:#5B6070" text-anchor="middle">2024</text>
<rect x="672" y="64" width="20" height="30" rx="5" fill="#C97703"></rect>
<text x="599" y="160" style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;fill:#5B6070" text-anchor="middle">sort by year</text>

<line x1="698" y1="97" x2="738" y2="97" stroke="#5B6070" stroke-width="2" marker-end="url(#arrow3)"></line>

<text x="926" y="28" style="font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:14px;fill:#14161F" text-anchor="middle">summarise</text>
<rect x="756" y="76" width="70" height="70" rx="10" fill="#B23A48" opacity="0.35"></rect>
<rect x="752" y="72" width="70" height="70" rx="10" fill="#B23A48" opacity="0.5"></rect>
<rect x="748" y="68" width="70" height="70" rx="10" fill="#B23A48" opacity="0.7"></rect>
<rect x="744" y="64" width="70" height="70" rx="10" fill="#B23A48"></rect>
