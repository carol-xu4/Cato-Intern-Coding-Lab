<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cato Intern Coding Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F5F3; --panel:#FBFBF9; --ink:#14161F; --muted:#5B6070; --rule:#DCDDD6;
    --a-intro:#3A3D49; --a-book:#4A4030;
    --a-health:#3043B4; --a-education:#0D0E51; --a-econ:#1B7A4B; --a-immig:#B23A48;
    --a-social:#8A5A2B; --a-tech:#6D3FA3; --a-energy:#0E7C86; --a-fun:#C97703;
    --display:"Space Grotesk",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --sidebar:260px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .side{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar);background:var(--panel);border-right:2px solid var(--ink);overflow-y:auto;z-index:10;padding:22px 0 30px}
  .side .brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;padding:0 20px 4px}
  .side .brandsub{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 20px 18px;border-bottom:1px solid var(--rule);margin-bottom:10px}
  .side .sec{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:16px 20px 6px;font-weight:600}
  .side .subsec{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:9px 20px 2px 20px;opacity:.85}
  .side a{display:flex;gap:9px;align-items:center;padding:5px 20px;font-size:13px;color:var(--ink);text-decoration:none;cursor:pointer;border-left:3px solid transparent;line-height:1.25}
  .side a:hover{background:#EFEFE9}
  .side a.on{border-left-color:var(--ac,var(--ink));background:#EDEEE8;font-weight:600;color:var(--ac,var(--ink))}
  .side a .dot{width:9px;height:9px;border-radius:2px;background:var(--ac,var(--muted));flex:none}
  .main{margin-left:var(--sidebar);min-height:100vh;display:flex;flex-direction:column}
  .wrap{position:relative;max-width:900px;width:100%;margin:0 auto;padding:30px 34px 130px;flex:1 0 auto}
  .topbar{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:9px;margin-bottom:30px}
  .mark{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .obs{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--muted)}
  .menubtn{display:none}
  .slide{animation:rise .3s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.slide{animation:none}}
  .eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:16px;color:var(--area,var(--ink))}
  .eyebrow .box{width:15px;height:15px;border:2px solid var(--area,var(--ink));border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
  .eyebrow .chip{width:32px;height:8px;border-radius:2px;background:var(--area,var(--ink));margin-left:auto}
  .kick{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--area,var(--ink));margin-bottom:14px}
  h1.q{font-family:var(--display);font-weight:600;font-size:clamp(23px,3.9vw,35px);line-height:1.15;letter-spacing:-.015em;margin:0 0 22px;padding-left:16px;border-left:5px solid var(--area,var(--ink))}
  .hero{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,58px);line-height:1.05;letter-spacing:-.02em;margin:8px 0 14px}
  .hero-sub{font-size:clamp(17px,2.4vw,22px);color:var(--muted);max-width:30ch;margin-bottom:26px;font-weight:400}
  .lede{font-size:16px;max-width:64ch}
  .lede p{margin:0 0 14px}
  b,strong{font-weight:600}
  .tok{font-family:var(--mono);font-size:.85em;background:#E9EAE4;padding:1px 6px;border-radius:4px;white-space:nowrap}
  .kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:2px 7px;background:var(--panel)}
  .h3{font-family:var(--display);font-weight:600;font-size:19px;margin:26px 0 10px;padding-top:20px;border-top:1px solid var(--rule)}
  .note{background:var(--panel);border:1.5px solid var(--rule);border-left:4px solid var(--area,var(--ink));border-radius:8px;padding:13px 16px;font-size:14.5px;margin:18px 0;max-width:64ch}
  .note b{color:var(--area,var(--ink))}
  ul.pts{padding-left:0;list-style:none;max-width:66ch;margin:6px 0}
  ul.pts li{padding:8px 0 8px 26px;position:relative;font-size:15px;border-bottom:1px solid var(--rule)}
  ul.pts li::before{content:"";position:absolute;left:2px;top:15px;width:9px;height:9px;background:var(--area,var(--ink));border-radius:2px}
  .fig{margin:16px 0}
  .fig img{max-width:100%;border:1.5px solid var(--rule);border-radius:8px;display:block;background:#fff}
  .fig figcaption{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px}
  .figrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:14px 0}
  .figrow .fig{margin:0}
  .code{background:#14161F;border-radius:10px;margin:14px 0;position:relative;max-width:100%}
  .code .bar{display:flex;align-items:center;padding:8px 13px;border-bottom:1px solid #2A2D3A}
  .code .bar .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8891A6}
  .code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.62;color:#EDEEF2;tab-size:2}
  .copy{position:absolute;top:6px;right:9px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#8891A6;background:#242736;border:1px solid #333747;border-radius:6px;padding:5px 9px;cursor:pointer}
  .copy:hover{color:#EDEEF2}.copy.done{color:#5BAE7A}
  .cm{color:#7C8AA5;font-style:italic}.st{color:#C3E88D}.nu{color:#F78C6C}
  .op{color:#F07178}.fn{color:#82AAFF}.kw{color:#C792EA}
  .var{border-top:1px solid var(--rule);padding-top:14px;margin-top:16px}
  .var:first-child{border-top:none;margin-top:0;padding-top:0}
  .vh{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
  .vn{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--area,var(--ink))}
  .vd{font-size:13.5px;color:var(--muted)}
  table.codes{width:100%;border-collapse:collapse;font-size:13px;margin-top:2px}
  table.codes td{border-bottom:1px solid #ECEDE7;padding:3px 8px;vertical-align:top}
  table.codes td.c{font-family:var(--mono);white-space:nowrap;width:74px;color:var(--ink)}
  table.codes tr.grp td{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:none;padding-top:11px;font-weight:600}
  .vdef{font-size:14px;margin:2px 0 0;max-width:64ch}
  table.cb{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}
  table.cb th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--ink);padding:8px 10px}
  table.cb td{border-bottom:1px solid var(--rule);padding:8px 10px}
  table.cb td.v{font-family:var(--mono);font-weight:600}
  table.cb th.num{text-align:right}
  table.cb td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .cap{font-size:12.5px;color:var(--muted);margin:4px 0 0}
  .qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
  .qcard{text-align:left;border:1.5px solid var(--rule);border-radius:10px;background:var(--panel);padding:12px 13px;cursor:pointer;font:inherit;color:inherit}
  .qcard:hover{border-color:var(--qa,var(--ink));transform:translateY(-1px)}
  .qcard .qa{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--qa,var(--ink));font-weight:600}
  .qcard .qq{font-size:13px;margin-top:5px;line-height:1.3}
  .reveals{margin-top:4px;display:flex;flex-direction:column;gap:12px;max-width:800px}
  details{border:1.5px solid var(--rule);border-radius:10px;background:var(--panel);overflow:hidden}
  details[open]{border-color:var(--area,var(--ink))}
  summary{cursor:pointer;list-style:none;padding:12px 15px;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;user-select:none}
  summary::-webkit-details-marker{display:none}
  summary .tag{font-size:11px;color:#fff;background:var(--area,var(--ink));padding:4px 10px;border-radius:5px;letter-spacing:.1em}
  summary .arrow{margin-left:auto;transition:transform .2s;color:var(--muted);font-size:17px}
  details[open] summary .arrow{transform:rotate(90deg)}
  @media (prefers-reduced-motion:reduce){summary .arrow{transition:none}}
  .rb{padding:0 15px 15px}
  .hint-text{font-size:15px;margin:0 0 12px}
  .varline{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .varline .lab{letter-spacing:.08em;text-transform:uppercase}
  .varline .v{background:var(--area,var(--ink));color:#fff;padding:2px 8px;border-radius:4px}
  .rb .code{margin:0}
  .nav{position:fixed;left:var(--sidebar);right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(6px);border-top:2px solid var(--ink)}
  .nav-inner{max-width:900px;margin:0 auto;padding:10px 34px;display:flex;align-items:center;gap:13px}
  button.btn{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer}
  button.btn:hover:not(:disabled){background:var(--ink);color:var(--paper)}
  button.btn:disabled{opacity:.32;cursor:not-allowed}
  .prog{flex:1;height:6px;background:var(--rule);border-radius:99px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
  .ghost{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  @media(max-width:820px){
    :root{--sidebar:0px}
    .side{transform:translateX(-100%);transition:transform .25s;width:250px}
    .side.open{transform:none}
    .main{margin-left:0}.nav{left:0}.menubtn{display:inline-block}
    .wrap{padding:24px 18px 130px}.nav-inner{padding:10px 16px}.ghost{display:none}
  }
  @media print{
    .side,.nav,.topbar .obs,.menubtn,.copy{display:none!important}
    body{background:#fff}.main{margin-left:0}.wrap{max-width:none;padding:0}
    .slide{page-break-after:always;break-after:page;padding:12mm;animation:none}
    details .rb{display:block}details>summary{pointer-events:none}summary .arrow{display:none}
    .code{background:#f4f4f0}.code pre{color:#111}.cm{color:#587}.st{color:#264}.fn{color:#036}.op{color:#903}.nu{color:#a40}.kw{color:#619}
  }
</style>
</head>
<body>

<div class="main">

    <div class="topbar">
      <div class="mark"><button class="btn menubtn" id="menu" style="padding:4px 9px;margin-right:8px">&#9776;</button>ACS + R</div>

</div>

<script>
const AC = {
  intro:"--a-intro", book:"--a-book",
  health:"--a-health", education:"--a-education", econ:"--a-econ", immig:"--a-immig",
  tech:"--a-tech", energy:"--a-energy", fun:"--a-fun"
};
const AREA_NAME = {
  health:"Health", education:"Education", econ:"General economics", immig:"Immigration",
  tech:"Technology", energy:"Energy / environment", fun:"Bonus"
};
const S = [
{sec:"intro", area:"intro", tag:"Welcome", hero:true,
 blocks:[{h:`<div class="hero">Cato Intern Coding Lab</div>
   <div class="hero-sub">Turning the American Community Survey into policy answers</div>
   <p class="lede">Use the contents on the left to jump between the intro, the codebook, and the questions.
   Arrow keys move one slide at a time.</p>`}]},
{sec:"intro", area:"intro", tag:"What is the ACS?", kick:"Intro", q:"What is the ACS?",
 blocks:[
   {h:`<p class="lede">The <b>American Community Survey</b> is the Census Bureau's largest annual survey \u2014
   roughly 3.5 million households a year, asked in detail about work, income, family, health coverage,
   housing, schooling, and how they get around. It is where numbers like the poverty rate, the uninsured
   rate, commute times, and where immigrants settle actually come from.</p>
   <p class="lede">Policy researchers lean on it constantly, because almost any question of the form
   <i>&ldquo;how does X relate to Y, for group Z?&rdquo;</i> has an answer buried in it. A few examples a policy
   analyst might actually ask:</p>`},
   {pts:[
     "How has the share of people without health insurance changed over the past decade?",
     "Does personal income really rise with education \u2014 and by how much?",
     "Which states have the largest foreign-born populations, and how fast are they growing?",
     "How much more common is working from home now than before the pandemic?",
     "What share of children live in families below the poverty line?"]},
   {h:`<div class="h3">And here's the kind of thing you can build</div>
     <p class="lede">Real charts made from ACS microdata:</p>
     <div class="figrow">
       <figure class="fig"><img src="Results/medicaid_undoc_parents_vs_children.png" alt="Medicaid: children vs. undocumented parents"><figcaption>Medicaid: children vs. undocumented parents</figcaption></figure>
       <figure class="fig"><img src="Results/one_undoc_parent_composition.png" alt="Households with one undocumented parent"><figcaption>Households with one undocumented parent</figcaption></figure>
       <figure class="fig"><img src="Results/ACS_CA_uninsured.png" alt="Uninsured Rate in California"><figcaption>Uninsured Rate in California</figcaption></figure>
     </div>`}]},
{sec:"intro", area:"intro", tag:"Three steps", kick:"Intro", q:"Three steps for every question",
 blocks:[
   {h:`<p class="lede">Every question today becomes the same three moves:</p>`},
   {pts:[
     "<b>filter</b> \u2014 which people? (adults, one year, workers...)",
     "<b>group_by</b> \u2014 compare across what? (states, years, education...)",
     "<b>summarise</b> \u2014 what number? (a count, a share, a median...)"]},
   {h:`<p class="lede">Take a real one: <b>how many adults were on Medicaid?</b> We <b>filter</b> to adults
     who are on Medicaid, then <b>summarise</b> by counting them. Want it for every year? Add a
     <b>group_by(year)</b> in the middle and the count comes back once per year</p>`}]},
{sec:"intro", area:"intro", tag:"Set up", kick:"Intro", q:"Set up your workspace",
 blocks:[
   {pts:[
     "<b>Working directory</b> \u2014 the folder R reads from and writes to. Set it once and your file paths stay short.",
     "<b>Packages are a toolkit</b> \u2014 bundles of ready-made functions someone else wrote. Install a package once with install.packages(), then load it each session with library() to get its tools.",
     "<b>read_csv()</b> \u2014 reads your data file into an object you can work with."]},
   {code:`# Set working directory
setwd("C:/Users/CarolXu/OneDrive - Cato Institute/Desktop/Intern Coding Lab")

# confirm where you are
getwd()

# Packages
install.packages("tidyverse")

library(tidyverse)

# load the data
data <- read_csv("data/acs00015.csv")`},
   {h:`<div class="note"><b>Before you start:</b> make sure the data file <span class="tok">acs00015.csv</span>
     is saved inside the <span class="tok">data</span> folder of your working directory.</div>`},
   {h:`<div class="h3">What did &lt;- and data just do?</div>
     <p class="lede"><b>&lt;- is assignment.</b> It means &ldquo;save the thing on the right into the name on the
     left.&rdquo; So <span class="tok">data &lt;- read_csv(...)</span> runs read_csv and stores the result under
     the name <b>data</b>.</p>
     <p class="lede"><b>data is now an object</b> \u2014 specifically a <i>data frame</i>: one giant table sitting
     in memory, with a row for every person and a column for every variable. Everything else today is just
     asking questions of that table.</p>`}]},
{sec:"intro", area:"intro", tag:"First look", kick:"Intro", q:"Take a first look",
 blocks:[
   {h:`<p class="lede">Never trust a file you haven't looked at.</p>`},
   {code:`# number of rows
nrow(data)

# rows x columns (people x variables)
dim(data)

# what variables are here?
names(data)

# view the first few rows
head(data)`},
   {h:`<div class="h3">Zooming in</div>
     <p class="lede">Pull a single column, or make a quick tally of a category.</p>`},
   {code:`# Every person's age, as a list of numbers
data$age

# how many rows of each category
count(data, sex)

# how many on Medicaid
count(data, hinscaid)

# how many rows per state
count(data, statefip)`},
   {h:`<div class="h3">table() vs count()</div>
     <p class="lede">Both tally categories, but they're different tools. <span class="tok">table()</span> is base R
     and returns a grid; <span class="tok">count()</span> is from the tidyverse and returns a tidy data frame with a
     count column named <span class="tok">n</span>.</p>`},
   {code:`# base R: a cross-tab grid (years down the side, marital status across the top)
table(data$year, data$marst)

# tidyverse: a tidy data frame with one row per combination and a count column 'n'
count(data, year, marst)`},
   {h:`<p class="lede">Reach for <span class="tok">table()</span> for a quick cross-tab to eyeball in the console;
     reach for <span class="tok">count()</span> when you want a result you'll pipe onward into a plot or another step.</p>
     <div class="h3">Quick summary functions</div>
     <p class="lede">For a numeric column, <span class="tok">sum()</span>, <span class="tok">mean()</span>,
     <span class="tok">median()</span>, <span class="tok">min()</span>, and <span class="tok">max()</span> each return
     one number. <span class="tok">summary()</span> gives several at once \u2014 the min, quartiles, mean, and max:</p>`},
   {code:`summary(data$inctot)   # min, 1st quartile, median, mean, 3rd quartile, max

mean(data$age)         # average age

median(data$inctot, na.rm = TRUE)    # the middle income`},
   {h:`<div class="h3">Saving a table</div>
     <p class="lede">Once you've made a summary table, <span class="tok">write_csv()</span> saves it to a file \u2014
     the mirror image of <span class="tok">read_csv()</span>:</p>`},
   {code:`# make a table, then save it to your Results folder
state_counts <- count(data, statefip)

write_csv(state_counts, "Results/state_counts.csv")`}]},
{sec:"intro", area:"intro", tag:"Core functions", kick:"Intro", q:"The three core functions, in detail",
 blocks:[
   {h:`<p class="lede">Each function does one job. When working with data, we save results as new objects with
     <span class="tok">&lt;-</span>, then build on them step by step.</p>
     <div class="h3" style="border-top:none;padding-top:0;margin-top:8px">The pipe: %>%</div>
     <p class="lede">The pipe passes the thing on its left into the function on its right \u2014 read it as
     &ldquo;and then.&rdquo; These two lines are identical, i.e. &ldquo;take data, and then count by sex.&rdquo;
     Pipes let you chain steps in the order you'd read them.</p>`},
   {code:`count(data, sex)        # count 'sex' in 'data'

data %>% count(sex)     # take 'data' AND THEN count by 'sex'`},
   {h:`<div class="h3">filter() \u2014 pick rows</div>
     <p class="lede">Keeps rows that pass a test. Commas mean <i>and</i>.
     <span class="tok">==</span> equals, <span class="tok">&gt;=</span> at least,
     <span class="tok">&lt;</span> less than, <span class="tok">%in%</span> is one of.</p>`},
   {code:`# save each filtered result as its own object
adults      <- data %>% filter(age >= 18)

workers_24  <- data %>% filter(year == 2024, empstat == 1)   # employed in 2024

immigrants  <- data %>% filter(bpl >= 100)                   # born abroad

young_grads <- data %>% filter(age >= 25, age <= 34, educ >= 10)

# %in% keeps rows matching ANY value in a set -- here, all public-transit commuters
transit <- data %>% filter(tranwork %in% c(31, 32, 33, 34, 35, 36, 37))`},
   {h:`<div class="h3">group_by() + summarise() \u2014 one number per group</div>
     <p class="lede">group_by draws invisible dividers; summarise collapses each group to a single row.
     Useful summaries: <span class="tok">n()</span> counts rows, plus
     <span class="tok">median(x)</span> and <span class="tok">mean(x)</span>.</p>`},
   {code:`# median personal income at each education level
income_by_educ <- data %>%
  filter(inctot != 9999999) %>%      # drop the "N/A" income code
  group_by(educ) %>%
  summarise(median_income = median(inctot))

income_by_educ        # print the result to look at it`},
   {h:`<p class="lede">Inside <span class="tok">summarise()</span> you can use any function that turns many
     numbers into one: <span class="tok">n()</span> counts rows, and
     <span class="tok">sum()</span>, <span class="tok">mean()</span>, <span class="tok">median()</span>,
     <span class="tok">min()</span>, <span class="tok">max()</span>, and <span class="tok">sd()</span>
     each summarise a column.</p>
     <div class="h3">The share trick</div>
     <p class="lede">The mean of a TRUE/FALSE test is a proportion \u2014 times 100 gives a percent.
     Here we build on the <span class="tok">adults</span> object we made above.</p>`},
   {code:`# share of adults uninsured, by state
uninsured_by_state <- adults %>%
  group_by(statefip) %>%
  summarise(pct = 100 * mean(hcovany == 1))   # hcovany 1 = no coverage

# to rank the result, add arrange() to sort high-to-low
uninsured_by_state %>% arrange(desc(pct))`},
   {h:`<div class="h3">Seeing every row</div>
     <p class="lede">By default R prints only the first 10 rows of a big table. A state table has 50+ rows \u2014
     print them all with <span class="tok">n = Inf</span>:</p>`},
   {code:`print(uninsured_by_state, n = Inf)`},
   {h:`<div class="h3">Putting it together: adults on Medicaid</div>
     <p class="lede">The example from the start of the lab \u2014 filter, then count; add group_by(year) for a trend:</p>`},
   {code:`# In 2024: how many adults were on Medicaid?
data %>%
  filter(year == 2024, age >= 18, hinscaid == 2) %>%   # hinscaid 2 = Medicaid/CHIP
  summarise(n = n())

# For every year: group_by(year) first, then count within each
medicaid_by_year <- data %>%
  filter(age >= 18, hinscaid == 2) %>%
  group_by(year) %>%
  summarise(n = n())

print(medicaid_by_year, n = Inf)`}]},
{sec:"intro", area:"intro", tag:"Weights (optional)", kick:"Intro", q:"Optional: working with the weights",
 blocks:[
   {h:`<div class="note"><b>Remember:</b> the ACS surveys a fraction of the country.
     The unweighted count is how many <b>survey responses</b>. The weighted count is how many <b>Americans</b>.</div>`},
   {h:`<p class="lede">
     The ACS is a <b>sample</b>. Each row carries a weight, <span class="tok">perwt</span>: how many people
     that single response represents in America. Counting rows with <span class="tok">n()</span> gives survey
     responses; summing <span class="tok">perwt</span> estimates the real <b>population</b>; and a weighted mean
     turns that into a <b>rate</b>. Here's Medicaid coverage by year with all three:</p>`},
   {code:`# Medicaid coverage by year: responses, weighted population, and weighted rate
medicaid_rates <- data %>%
  group_by(year) %>%
  summarise(
    n = n(),                                     # survey responses (unweighted)
    pop = sum(perwt),                            # weighted population estimate
    pct = 100 * weighted.mean(hinscaid == 2, perwt),   # weighted % on Medicaid -- 2 = Medicaid/CHIP
    .groups = "drop")`},
   {h:`<p class="lede"><span class="tok">n</span> is survey responses, <span class="tok">pop</span> is the
     weighted estimate of Americans, and <span class="tok">pct</span> is the weighted Medicaid rate \u2014 the
     number to report.</p>
     <table class="cb"><tr><th>year</th><th class="num">n</th><th class="num">pop</th><th class="num">pct</th></tr>
     <tr><td class="v">2016</td><td class="num">40,164</td><td class="num">324,989,600</td><td class="num">21.5%</td></tr>
     <tr><td class="v">2017</td><td class="num">39,928</td><td class="num">330,109,059</td><td class="num">21.5%</td></tr>
     <tr><td class="v">2018</td><td class="num">40,016</td><td class="num">334,696,293</td><td class="num">21.3%</td></tr>
     <tr><td class="v">2019</td><td class="num">39,516</td><td class="num">325,235,735</td><td class="num">20.8%</td></tr>
     <tr><td class="v">2020</td><td class="num">40,320</td><td class="num">328,463,767</td><td class="num">19.9%</td></tr>
     <tr><td class="v">2021</td><td class="num">39,634</td><td class="num">331,139,859</td><td class="num">21.5%</td></tr>
     <tr><td class="v">2022</td><td class="num">39,844</td><td class="num">336,523,714</td><td class="num">21.4%</td></tr>
     <tr><td class="v">2023</td><td class="num">40,017</td><td class="num">336,056,297</td><td class="num">21.3%</td></tr>
     <tr><td class="v">2024</td><td class="num">39,609</td><td class="num">338,957,842</td><td class="num">20.9%</td></tr>
     </table>
     <div class="note"><b>Note on this dataset:</b> this is a <b>smaller extract</b> of the ACS via IPUMS. The
     weights have been re-adjusted so the population estimates still hold, but the sample is much smaller than
     the full ACS \u2014 roughly 40,000 rows per year here, versus the several million per year in the complete
     data. Expect noisier estimates for small subgroups than you'd get from the full files.</div>
     <div class="h3">How the Census builds the weights</div>
     <p class="lede">Each person starts with a <b>base weight</b> \u2014 the inverse of their chance of being
     sampled. The Census Bureau then adjusts it for household nonresponse, and finally <b>rakes</b> the weights
     so the survey totals match independent population estimates by age, sex, race, Hispanic origin, and state.
     The end result, <span class="tok">perwt</span>, is how many people in the country each respondent represents.</p>`}]},
{sec:"intro", area:"intro", tag:"ggplot", kick:"Intro", q:"Making plots with ggplot",
 blocks:[
   {h:`<p class="lede">A ggplot is built in layers joined by <span class="tok">+</span>: the <b>data</b>,
     an <b>aes()</b> mapping columns to visual properties, and a <b>geom</b> for what to draw.</p>
     <div class="h3">The grammar of graphics</div>
     <p class="lede">Every plot follows the same template \u2014 fill in the data, the mappings, and a geom:</p>`},
   {code:`ggplot(data = <DATA>, mapping = aes(<MAPPINGS>)) +
  <GEOM_FUNCTION>()`},
   {h:`<p class="lede"><b>aes() mappings</b> connect columns to what you see: <span class="tok">x</span> and
     <span class="tok">y</span>, plus <span class="tok">color</span>, <span class="tok">fill</span>,
     <span class="tok">size</span>, <span class="tok">shape</span>, and <span class="tok">linetype</span>.
     Common <b>geoms</b>: <span class="tok">geom_col()</span> and <span class="tok">geom_bar()</span> for bars,
     <span class="tok">geom_line()</span> + <span class="tok">geom_point()</span> for trends,
     <span class="tok">geom_histogram()</span> for a distribution, <span class="tok">geom_boxplot()</span> for spread.</p>
     <div class="h3">The basics</div>`},
   {code:`# a real example: build a summary table from our data first
medicaid_by_year <- data %>%
  filter(age >= 18, hinscaid == 2) %>%
  group_by(year) %>%
  summarise(n = n())

# lines -- a trend over time
ggplot(medicaid_by_year, aes(x = year, y = n)) +
  geom_line() + geom_point()

# bars -- the same numbers as columns
ggplot(medicaid_by_year, aes(x = factor(year), y = n)) +
  geom_col()`},
   {h:`<div class="note"><b>Why <span class="tok">factor(year)</span>?</b> On the line chart <span class="tok">year</span>
     is left numeric, so the x-axis is a continuous number line \u2014 right for a trend. For bars we wrap it in
     <span class="tok">factor()</span> to make it a category, so each year becomes its own evenly spaced bar with a
     clean label, instead of being treated as a number (which can produce odd spacing or fractional
     axis breaks like 2018.5).</div>`},
   {h:`<div class="h3">A prettier version (Cato style)</div>
     <p class="lede">Now <b>weighted</b> to a population estimate (sum <span class="tok">perwt</span>), dressed up with a
     custom colour, a comma axis, titles, and a theme \u2014 then saved to a file with
     <span class="tok">ggsave()</span>:</p>`},
   {code:`# weighted this time: sum perwt for a population estimate
medicaid_wt <- data %>%
  filter(age >= 18, hinscaid == 2) %>%
  group_by(year) %>%
  summarise(population = sum(perwt))

ggplot(medicaid_wt, aes(x = as.numeric(year), y = population)) +
  geom_line(linewidth = 1.2, color = "#3043B4") +
  geom_point(size = 2, color = "#3043B4") +
  scale_x_continuous(breaks = seq(2016, 2024, by = 2), expand = c(0.02, 0)) +
  scale_y_continuous(labels = scales::label_number(scale = 1e-6, suffix = "M"),
                     limits = c(NA, 44000000),
                     expand = expansion(mult = c(0.08, 0))) +
  labs(
    title = "Adults on Medicaid, 2016-2024",
    subtitle = "Weighted population estimate (ACS)",
    x = NULL, y = NULL,
    caption = "Source: ACS PUMS via IPUMS") +
  theme_minimal() +
  theme(
    plot.title = element_text(size = 14, face = "bold", hjust = 0, color = "black"),
    plot.subtitle = element_text(size = 11, color = "gray40", hjust = 0, margin = margin(b = 12)),
    panel.grid.major.x = element_blank(),
    panel.grid.minor = element_blank(),
    panel.grid.major.y = element_line(color = "gray90", linewidth = 0.5),
    axis.line = element_blank(),
    axis.ticks = element_blank(),
    axis.text = element_text(size = 10, color = "gray40"),
    plot.caption = element_text(size = 8, color = "gray40", hjust = 0),
    plot.caption.position = "plot",
    plot.title.position = "plot",
    plot.background = element_rect(fill = "white", color = NA),
    panel.background = element_rect(fill = "white", color = NA))

ggsave("Results/medicaid_adults.png", width = 8, height = 5)`},
   {h:`<div class="h3">Splitting adults vs. kids</div>
     <p class="lede">Add a group column, map it to <span class="tok">color</span>, and set the two colours by
     hand \u2014 adults blue, kids orange:</p>`},
   {code:`# one row per year per group
medicaid_grp <- data %>%
  filter(hinscaid == 2) %>%
  group_by(year, group = if_else(age < 19, "Kids", "Adults")) %>%
  summarise(n = n(), .groups = "drop")

ggplot(medicaid_grp, aes(x = as.numeric(year), y = n, color = group)) +
  geom_line(linewidth = 1.2) +
  geom_point(size = 2) +
  scale_color_manual(values = c(
    "Adults" = "#3043B4",
    "Kids"   = "#C97703")) +
  scale_x_continuous(breaks = seq(2016, 2024, by = 2), expand = c(0.02, 0)) +
  scale_y_continuous(labels = scales::comma, limits = c(2000, 6000), expand = c(0, 0)) +
  labs(
    title = "On Medicaid: Adults vs. Kids (2016-2024)",
    subtitle = "ACS sample counts",
    x = NULL, y = NULL, color = NULL,
    caption = "Source: ACS PUMS via IPUMS") +
  theme_minimal() +
  theme(
    plot.title = element_text(size = 14, face = "bold", hjust = 0, color = "black"),
    plot.subtitle = element_text(size = 11, color = "gray40", hjust = 0, margin = margin(b = 12)),
    legend.position = "top",
    legend.justification = "left",
    legend.text = element_text(size = 10),
    legend.key.width = unit(1.5, "cm"),
    panel.grid.major.x = element_blank(),
    panel.grid.minor = element_blank(),
    panel.grid.major.y = element_line(color = "gray90", linewidth = 0.5),
    axis.line = element_blank(),
    axis.ticks = element_blank(),
    axis.text = element_text(size = 10, color = "gray40"),
    plot.caption = element_text(size = 8, color = "gray40", hjust = 0),
    plot.caption.position = "plot",
    plot.title.position = "plot",
    plot.background = element_rect(fill = "white", color = NA),
    panel.background = element_rect(fill = "white", color = NA))

ggsave("Results/medicaid_adults_vs_kids.png", width = 8, height = 5)`}]},
{sec:"book", area:"book", tag:"Demographics", kick:"Codebook", q:"Codebook — who each person is",
 blocks:[{h:`<div class="var"><div class="vh"><span class="vn">year</span><span class="vd">Census/survey year</span></div><p class="vdef">Survey year. This extract has one ACS sample per year, 2016 through 2024.</p></div><div class="var"><div class="vh"><span class="vn">statefip</span><span class="vd">State (FIPS code)</span></div><table class="codes"><tr><td class="c">06</td><td>California</td></tr><tr><td class="c">36</td><td>New York</td></tr><tr><td class="c">48</td><td>Texas</td></tr></table><p class="vdef">Full state list is in the IPUMS codebook; TX=48, CA=6, NY=36 are the ones used in the questions.</p></div><div class="var"><div class="vh"><span class="vn">sex</span><span class="vd">Sex</span></div><table class="codes"><tr><td class="c">1</td><td>Male</td></tr><tr><td class="c">2</td><td>Female</td></tr></table></div><div class="var"><div class="vh"><span class="vn">age</span><span class="vd">Age</span></div><p class="vdef">Age in years. 000 = under 1; 999 = missing.</p></div><div class="var"><div class="vh"><span class="vn">marst</span><span class="vd">Marital status</span></div><table class="codes"><tr><td class="c">1</td><td>Married, spouse present</td></tr><tr><td class="c">2</td><td>Married, spouse absent</td></tr><tr><td class="c">3</td><td>Separated</td></tr><tr><td class="c">4</td><td>Divorced</td></tr><tr><td class="c">5</td><td>Widowed</td></tr><tr><td class="c">6</td><td>Never married/single</td></tr></table></div><div class="var"><div class="vh"><span class="vn">bpl</span><span class="vd">Birthplace</span></div><p class="vdef">Codes below 100 are U.S. states/territories; 100 and up are foreign countries. So bpl &gt;= 100 means foreign-born.</p></div><div class="var"><div class="vh"><span class="vn">citizen</span><span class="vd">Citizenship status</span></div><table class="codes"><tr><td class="c">0</td><td>N/A (born in the U.S.)</td></tr><tr><td class="c">1</td><td>Born abroad of American parents</td></tr><tr><td class="c">2</td><td>Naturalized citizen</td></tr><tr><td class="c">3</td><td>Not a citizen</td></tr></table></div><div class="var"><div class="vh"><span class="vn">yrimmig</span><span class="vd">Year of immigration</span></div><p class="vdef">Four-digit year the person came to the U.S. 0 = N/A (U.S. born).</p></div><div class="var"><div class="vh"><span class="vn">educ</span><span class="vd">Educational attainment</span></div><table class="codes"><tr><td class="c">00</td><td>N/A or no schooling</td></tr><tr><td class="c">01</td><td>Nursery school to grade 4</td></tr><tr><td class="c">02</td><td>Grade 5, 6, 7, or 8</td></tr><tr><td class="c">03</td><td>Grade 9</td></tr><tr><td class="c">04</td><td>Grade 10</td></tr><tr><td class="c">05</td><td>Grade 11</td></tr><tr><td class="c">06</td><td>Grade 12 (high school)</td></tr><tr><td class="c">07</td><td>1 year of college</td></tr><tr><td class="c">08</td><td>2 years of college</td></tr><tr><td class="c">09</td><td>3 years of college</td></tr><tr><td class="c">10</td><td>4 years of college (bachelor's)</td></tr><tr><td class="c">11</td><td>5+ years of college</td></tr></table><p class="vdef">Roughly, educ &gt;= 10 means a bachelor's degree or higher.</p></div>`}]},
{sec:"book", area:"book", tag:"Work & money", kick:"Codebook", q:"Codebook — work &amp; money",
 blocks:[{h:`<div class="var"><div class="vh"><span class="vn">empstat</span><span class="vd">Employment status</span></div><table class="codes"><tr><td class="c">0</td><td>N/A</td></tr><tr><td class="c">1</td><td>Employed</td></tr><tr><td class="c">2</td><td>Unemployed</td></tr><tr><td class="c">3</td><td>Not in labor force</td></tr></table></div><div class="var"><div class="vh"><span class="vn">occ2010</span><span class="vd">Occupation (2010 basis)</span></div><p class="vdef">Hundreds of occupation codes; e.g. 2100 = lawyers/judges, 4040 = bartenders, 7800 = bakers. See the full IPUMS OCC2010 list.</p></div><div class="var"><div class="vh"><span class="vn">uhrswork</span><span class="vd">Usual hours worked per week</span></div><p class="vdef">0 = N/A; 99 is a topcode (99+).</p></div><div class="var"><div class="vh"><span class="vn">inctot</span><span class="vd">Total personal income</span></div><p class="vdef">Dollars. Can be negative. 9999999 = N/A.</p></div><div class="var"><div class="vh"><span class="vn">inctot2024</span><span class="vd">Total personal income (2024 dollars)</span></div><p class="vdef">inctot adjusted for inflation to 2024 dollars. This is not a native ACS variable \u2014 we created it while cleaning the original data, so incomes can be compared fairly across survey years. Use it in place of inctot whenever a question spans multiple years.</p></div><div class="var"><div class="vh"><span class="vn">ftotinc</span><span class="vd">Total family income</span></div><p class="vdef">Dollars. 9999999 = N/A.</p></div><div class="var"><div class="vh"><span class="vn">ftotinc2024</span><span class="vd">Total family income (2024 dollars)</span></div><p class="vdef">ftotinc adjusted for inflation to 2024 dollars. Like inctot2024, this is not a native ACS variable \u2014 we created it while cleaning the original data so family incomes can be compared across survey years. Use it in place of ftotinc for any cross-year comparison.</p></div><div class="var"><div class="vh"><span class="vn">incwage</span><span class="vd">Wage and salary income</span></div><p class="vdef">Dollars. 999999 = N/A.</p></div><div class="var"><div class="vh"><span class="vn">poverty</span><span class="vd">Poverty status</span></div><p class="vdef">Family income as a % of the poverty line: 100 = at the line. 0 = N/A; capped at 501.</p></div><div class="var"><div class="vh"><span class="vn">tranwork</span><span class="vd">Means of transportation to work</span></div><table class="codes"><tr><td class="c">10</td><td>Auto, truck, or van</td></tr><tr><td class="c">20</td><td>Motorcycle</td></tr><tr><td class="c">31-37</td><td>Bus / rail / public transit</td></tr><tr><td class="c">39</td><td>Ferryboat</td></tr><tr><td class="c">50</td><td>Bicycle</td></tr><tr><td class="c">60</td><td>Walked only</td></tr><tr><td class="c">80</td><td>Worked at home</td></tr></table></div><div class="var"><div class="vh"><span class="vn">departs</span><span class="vd">Time of departure for work</span></div><p class="vdef">24-hour clock (0730 = 7:30 a.m.). 0 = N/A.</p></div></div>`}]},
{sec:"book", area:"book", tag:"Home & health", kick:"Codebook", q:"Codebook — home &amp; health",
 blocks:[{h:`<div class="var"><div class="vh"><span class="vn">hcovany</span><span class="vd">Any health insurance coverage</span></div><table class="codes"><tr><td class="c">1</td><td>No health insurance coverage</td></tr><tr><td class="c">2</td><td>With health insurance coverage</td></tr></table></div><div class="var"><div class="vh"><span class="vn">hinscaid</span><span class="vd">Health insurance through Medicaid</span></div><table class="codes"><tr><td class="c">1</td><td>No insurance through Medicaid</td></tr><tr><td class="c">2</td><td>Has insurance through Medicaid</td></tr></table></div><div class="var"><div class="vh"><span class="vn">cismrtphn</span><span class="vd">Smartphone in household</span></div><table class="codes"><tr><td class="c">0</td><td>N/A (GQ)</td></tr><tr><td class="c">1</td><td>Yes</td></tr><tr><td class="c">2</td><td>No</td></tr></table></div><div class="var"><div class="vh"><span class="vn">costelec</span><span class="vd">Annual electricity cost</span></div><p class="vdef">Dollars. Special codes near 9990+ mark included-in-rent / no charge / N/A \u2014 drop before averaging.</p></div>`}]},
{sec:"index", area:"intro", tag:"All questions"},
{sec:"q", area:"health", tag:"Uninsured over time",
 q:"From 2016 to 2024, how has the uninsured rate changed?",
 hint:"Take the average of an \u201cis uninsured\u201d test (hcovany == 1) among adults, grouped by year.",
 vars:["year","age","hcovany"],
 sol:`uninsured <- data %>%
  filter(age >= 18) %>%
  group_by(year) %>%
  summarise(pct = 100 * mean(hcovany == 1))   # hcovany 1 = no coverage

ggplot(uninsured, aes(year, pct)) +
  geom_line(linewidth = 1, color = "#3043B4") + geom_point() +
  labs(x = NULL, y = "% uninsured")`},
{sec:"q", area:"health", tag:"Kids on Medicaid: TX/CA/NY",
 q:"From 2016 to 2024, what share of children were on Medicaid in Texas, California, and New York?",
 hint:"Keep children in those three states (statefip 48, 6, 36), then take the Medicaid share grouped by year and state.",
 vars:["year","age","hinscaid","statefip"],
 sol:`kids <- data %>%
  filter(age < 19, statefip %in% c(48, 6, 36)) %>%   # 48 TX, 6 CA, 36 NY
  group_by(year, statefip) %>%
  summarise(pct = 100 * mean(hinscaid == 2), .groups = "drop")   # 2 = Medicaid/CHIP

ggplot(kids, aes(year, pct, color = factor(statefip))) +
  geom_line(linewidth = 1) + geom_point() +
  labs(x = NULL, y = "% of children on Medicaid", color = "State")`},
{sec:"q", area:"health", tag:"Medicaid by employment",
 q:"In 2024, was Medicaid coverage higher for unemployed than employed adults?",
 hint:"Filter to 2024 and working-age adults, group by employment status, then take the share on Medicaid in each.",
 vars:["year","age","empstat","hinscaid"],
 sol:`data %>%
  filter(year == 2024, age >= 18, age <= 64) %>%
  group_by(empstat) %>%          # 1 employed, 2 unemployed, 3 not in labor force
  summarise(pct_medicaid = 100 * mean(hinscaid == 2))`},
{sec:"q", area:"education", tag:"Income by education",
 q:"Is median personal income associated with education level?",
 hint:"Drop the N/A income code, then take a median of inctot2024 (inflation-adjusted) within each education level.",
 vars:["inctot2024","educ"],
 sol:`inc <- data %>%
  filter(inctot != 9999999) %>%   # 9999999 = N/A
  group_by(educ) %>%
  summarise(median_income = median(inctot2024))   # 2024 dollars, comparable across years

ggplot(inc, aes(factor(educ), median_income)) +
  geom_col(fill = "#0D0E51") +
  labs(x = "Education level (educ code)", y = "Median personal income (2024 $)")`},
{sec:"q", area:"education", tag:"Degrees by sex",
 q:"In 2024, did women or men aged 25+ hold college degrees at a higher rate?",
 hint:"\u201cBachelor\u2019s or higher\u201d is roughly educ \u2265 10. Filter to 2024 and adults 25+, then average that test by sex.",
 vars:["year","age","educ","sex"],
 sol:`data %>%
  filter(year == 2024, age >= 25) %>%
  group_by(sex) %>%              # 1 male, 2 female
  summarise(pct_ba = 100 * mean(educ >= 10))   # educ >= 10 ~ bachelor's+`},
{sec:"q", area:"education", tag:"Lawyers with econ degree",
 q:"Among adults 25\u201334, how many lawyers have an economics degree?",
 hint:"Lawyers are occ2010 == 2100 and an economics degree is degfieldd == 5501. Filter to adults 25\u201334 who are both, then count them.",
 vars:["age","occ2010","degfieldd"],
 sol:`data %>%
  filter(age >= 25, age <= 34, occ2010 == 2100, degfieldd == 5501) %>%   # 2100 = lawyers/judges, 5501 = economics
  summarise(n = n())`},
{sec:"q", area:"econ", tag:"Wages over time",
 q:"From 2016 to 2024, how did median wage income change year by year?",
 hint:"Keep people with real wage earnings, then group by year and take the median wage.",
 vars:["year","incwage"],
 sol:`wages <- data %>%
  filter(incwage > 0, incwage != 999999) %>%
  group_by(year) %>%
  summarise(median_wage = median(incwage))

ggplot(wages, aes(year, median_wage)) +
  geom_line(linewidth = 1, color = "#1B7A4B") + geom_point() +
  labs(x = NULL, y = "Median wage income")`},
{sec:"q", area:"econ", tag:"Employment over time",
 q:"From 2016 to 2024, how did the employment rate change?",
 hint:"Filter to ages 18\u201364, group by year, then take the share who are employed.",
 vars:["year","age","empstat"],
 sol:`emp <- data %>%
  filter(age >= 18, age <= 64) %>%
  group_by(year) %>%
  summarise(pct_employed = 100 * mean(empstat == 1))   # 1 = employed

(function assignImages(){

    if(s.sec!=='q')return;

function hiR(src){
  const KW=new Set(['TRUE','FALSE','NA','NULL','Inf','NaN','if','else','for','in','function','return']);
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let out='',i=0,n=src.length;const OP="<>=!+-*/&|~:?";
  while(i<n){
    const c=src[i];
    if(c==='#'){let j=i;while(j<n&&src[j]!=='\n')j++;out+='<span class="cm">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
    if(c==='"'||c==="'"){const q=c;let j=i+1;while(j<n){if(src[j]==='\\'){j+=2;continue;}if(src[j]===q){j++;break;}j++;}out+='<span class="st">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
    if(c>='0'&&c<='9'){let j=i;while(j<n&&/[0-9.eE]/.test(src[j]))j++;out+='<span class="nu">'+src.slice(i,j)+'</span>';i=j;continue;}
    if(/[A-Za-z._]/.test(c)){let j=i;while(j<n&&/[A-Za-z0-9._]/.test(src[j]))j++;const w=src.slice(i,j);let k=j;while(k<n&&src[k]===' ')k++;
      if(src[k]==='(')out+='<span class="fn">'+w+'</span>';else if(KW.has(w))out+='<span class="kw">'+w+'</span>';else out+=esc(w);i=j;continue;}
    if(c==='%'){let j=i+1;while(j<n&&src[j]!=='%')j++;j++;out+='<span class="op">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
    if(OP.includes(c)){let j=i;while(j<n&&OP.includes(src[j]))j++;out+='<span class="op">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
    out+=esc(c);i++;
  }
  return out;
}
function codeBlock(code,label){
  return '<div class="code"><div class="bar"><span class="lbl">'+(label||'R')+'</span></div>'+
    '<button class="copy" data-code="'+encodeURIComponent(code)+'">Copy</button><pre>'+hiR(code)+'</pre></div>';
}

let i=0;
function render(){
  const s=S[i];
  stage.style.setProperty('--area','var('+AC[s.area]+')');
  let html='';
  if(s.sec==='q'){
    html+='<div class="eyebrow"><span class="box">\u2713</span>'+AREA_NAME[s.area]+'<span class="chip"></span></div>';
    html+='<h1 class="q">'+s.q+'</h1>';
    const chips=(s.vars||[]).map(v=>'<span class="v">'+v+'</span>').join('');
    html+='<div class="reveals">'+
      '<details class="hint"><summary><span class="tag">Hint</span><span class="arrow">\u203a</span></summary>'+
        '<div class="rb"><p class="hint-text">'+s.hint+'</p><div class="varline"><span class="lab">Variables:</span>'+chips+'</div></div></details>'+
      '<details class="sol"><summary><span class="tag">Solution</span><span class="arrow">\u203a</span></summary>'+
        '<div class="rb">'+codeBlock(s.sol,'analysis.R')+
        ((s.hideImg?[]:(s.img||[])).map(im=>'<figure class="fig"><img src="Results/'+im+'.png" alt="'+im+'"><figcaption>Results/'+im+'.png</figcaption></figure>').join(''))+
        (s.tableHtml||'')+
        '</div></details>'+
    '</div>';
  } else if(s.sec==='index'){
    let qs=S.filter(x=>x.sec==='q');
    let areas=new Set(qs.map(x=>x.area));
    html+='<div class="kick">Questions</div><h1 class="q">The question bank</h1>';
    html+='<p class="lede">'+qs.length+' questions across '+areas.size+' policy areas. Click any to jump \u2014 or use the contents on the left.</p>';
    html+='<div class="qgrid">';
    S.forEach((x,idx)=>{ if(x.sec==='q'){ html+='<button class="qcard" style="--qa:var('+AC[x.area]+')" data-goto="'+idx+'"><div class="qa">'+AREA_NAME[x.area]+'</div><div class="qq">'+x.q+'</div></button>'; }});
    html+='</div>';
  } else {
    if(s.hero){ s.blocks.forEach(b=>{ if(b.h)html+=b.h; }); }
    else{
      if(s.kick)html+='<div class="kick">'+s.kick+'</div>';
      if(s.q)html+='<h1 class="q">'+s.q+'</h1>';
      s.blocks.forEach(b=>{

        if(b.pts)html+='<ul class="pts">'+b.pts.map(p=>'<li>'+p+'</li>').join('')+'</ul>';

      });
    }
  }
  stage.innerHTML=html;
  obs.textContent=String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
  bar.style.width=(i/(S.length-1))*100+'%';
  prevB.disabled=i===0; nextB.disabled=i===S.length-1;
  highlightToc();
  window.scrollTo({top:0,behavior:'instant'});
}
function go(n){ i=Math.max(0,Math.min(S.length-1,n)); render(); if(window.innerWidth<=820) side.classList.remove('open'); }
const toc=document.getElementById('toc');
const side=document.getElementById('side');
let tocRefs=[];
function addSecHeader(t){ const d=document.createElement('div'); d.className='sec'; d.textContent=t; toc.appendChild(d); }
function addSub(t){ const d=document.createElement('div'); d.className='subsec'; d.textContent=t; toc.appendChild(d); }
function addLink(idx,label,area){
  const a=document.createElement('a');
  a.style.setProperty('--ac','var('+AC[area]+')');
  a.innerHTML='<span class="dot"></span>'+label;
  a.onclick=()=>go(idx);
  a.dataset.idx=idx;
  toc.appendChild(a); tocRefs.push(a);
}
function buildToc(){
  toc.innerHTML=''; tocRefs=[];
  addSecHeader('Intro');
  S.forEach((s,idx)=>{ if(s.sec==='intro') addLink(idx,s.tag,'intro'); });
  addSecHeader('Codebook');
  S.forEach((s,idx)=>{ if(s.sec==='book') addLink(idx,s.tag,'book'); });
  addSecHeader('Questions');
  S.forEach((s,idx)=>{ if(s.sec==='index') addLink(idx,s.tag,'intro'); });
  let curArea=null;
  S.forEach((s,idx)=>{
    if(s.sec!=='q')return;
    if(s.area!==curArea){ curArea=s.area; addSub(AREA_NAME[s.area]); }
    addLink(idx,s.tag,s.area);
  });
}
function highlightToc(){ tocRefs.forEach(a=>a.classList.toggle('on', +a.dataset.idx===i)); }
prevB.onclick=()=>go(i-1);
nextB.onclick=()=>go(i+1);
document.getElementById('menu').onclick=()=>side.classList.toggle('open');
document.addEventListener('keydown',e=>{
  const t=(e.target.tagName||'').toLowerCase();
  if(t==='input'||t==='textarea')return;
  if(e.key==='ArrowRight')go(i+1);
  else if(e.key==='ArrowLeft')go(i-1);
});
stage.addEventListener('click',e=>{
  const g=e.target.closest('.qcard'); if(g){ go(+g.dataset.goto); return; }
  const b=e.target.closest('.copy'); if(!b)return;
  navigator.clipboard.writeText(decodeURIComponent(b.dataset.code)).then(()=>{
    b.textContent='Copied'; b.classList.add('done');
    setTimeout(()=>{b.textContent='Copy';b.classList.remove('done');},1400);
  });
});
buildToc();
render();
</script>
</body>
</html>
